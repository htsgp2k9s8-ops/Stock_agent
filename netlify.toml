[build]
  publish = "."
  command = ""

# Root → landing page (200 = rewrite, not redirect — URL stays theboringmillion.com)
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

# /dashboard → back to home (backend is not public)
[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
